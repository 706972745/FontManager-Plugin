# 插件发版：font-sync/** 有推送就重新打包，并覆盖上传到 v1 release
# （发布页 https://github.com/706972745/FontManager-Plugin/releases/latest 里的 zip 即最新版）
name: Plugin Release

on:
  push:
    branches: [main]
    paths:
      - "font-sync/**"
      - ".github/workflows/plugin-release.yml"
      - ".github/package_plugin.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 打包并自检
        run: python .github/package_plugin.py

      - name: 跑插件单测
        run: python -m unittest discover -s font-sync/tests

      # dist/ 里现在有 font-sync-<版本>.zip / font-sync.zip / font-sync-full.zip
      - name: 上传到 v1 release（同名 asset 覆盖）
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1 dist/*.zip --clobber --repo 706972745/FontManager-Plugin
